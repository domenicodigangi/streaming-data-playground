name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety pip-audit

    - name: Run Bandit
      run: |
        cd components/streaming_anomaly_detection/data-simulator
        bandit -r src/ -f json -o bandit-report.json
        bandit -r src/ -ll
      continue-on-error: true

    - name: Run Safety
      run: |
        cd components/streaming_anomaly_detection/data-simulator
        pip install -r <(poetry export -f requirements.txt)
        safety check
      continue-on-error: true

    - name: Run pip-audit
      run: |
        cd components/streaming_anomaly_detection/data-simulator
        pip install -r <(poetry export -f requirements.txt)
        pip-audit
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-report
        path: components/streaming_anomaly_detection/data-simulator/bandit-report.json

  java-security:
    name: Java Security Scan (OWASP Dependency Check)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: OWASP Dependency Check
      run: |
        cd components/streaming_anomaly_detection/flink/streamingad
        mvn org.owasp:dependency-check-maven:check || true

    - name: Upload OWASP report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: owasp-report
        path: components/streaming_anomaly_detection/flink/streamingad/target/dependency-check-report.html

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner - Data Simulator
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: 'components/streaming_anomaly_detection/data-simulator'
        format: 'sarif'
        output: 'trivy-simulator-results.sarif'
      continue-on-error: true

    - name: Run Trivy - Streamlit
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: 'components/streaming_anomaly_detection/gui/streamlit_streaming_ad'
        format: 'sarif'
        output: 'trivy-streamlit-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: '.'
      continue-on-error: true

  secrets-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for secret scanning

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
      continue-on-error: true
